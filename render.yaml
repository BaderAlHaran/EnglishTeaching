services:
  - type: web
    name: essay-writing-service
    env: python
    pythonVersion: 3.11.9
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: mikoandnenoarecool
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: contact@englishessaywriting.net
      - key: CONTACT_RECIPIENT
        value: contact@englishessaywriting.net
      - key: FROM_EMAIL
        value: no-reply@englishessaywriting.net
      - key: RESEND_API_KEY
        sync: false
      - key: UPLOAD_FOLDER
        value: uploads
      - key: CUSTOM_DOMAIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PORT
        sync: false
